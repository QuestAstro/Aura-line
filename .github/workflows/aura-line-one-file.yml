      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        shell: bash
        run: gradle --no-daemon --console=plain :app:assembleDebug
      - name: Upload finished APK
        uses: actions/upload-artifact@v4
        with:
          name: AURA-LINE-v0.2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
